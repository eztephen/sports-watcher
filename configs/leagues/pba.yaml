name: pba
court_length_m: 28.0
court_width_m: 15.0
three_point_radius_m: 6.75
three_point_corner_m: 6.60
basket_from_baseline_m: 1.575
free_throw_line_from_baseline_m: 5.8
key_width_m: 4.9
period_length_s: 600
periods: 4
overtime_length_s: 300
shot_clock_s: 24
asr_languages: [en, tl]
broadcasters:
  # One Sports (Cignal) PBA feed, calibrated 2026-10-31 on the Rain or Shine vs Converge
  # quarterfinal (1920x1080). Stacked bug bottom-left: team names, a white score column,
  # clock top-right, period and a red shot-clock box below it. Top row is treated as the
  # away team and bottom row as home (stacked-scoreboard convention); PBA venues are
  # neutral, so confirm the designation per game when it matters for settlement.
  one_sports:
    scoreboard_roi: {x: 0.045, y: 0.800, w: 0.300, h: 0.095}
    home_side: right
    shot_clock_visible: true
    # The digits change 5 to 6 s after the ball drops (a "+2" badge shows first) and up to
    # 8.2 s after the release of a three; measured on four baskets of the 2026-10-30
    # quarterfinal.
    score_lag_s: 10.0
    # Net to digits, measured on six baskets and free throws of the same game: 5.0 to 5.6 s.
    score_delay_s: 5.3
    fields:
      away:       {x: 0.226, y: 0.806, w: 0.050, h: 0.044}
      home:       {x: 0.226, y: 0.850, w: 0.050, h: 0.044}
      clock:      {x: 0.288, y: 0.812, w: 0.052, h: 0.032}
      period:     {x: 0.281, y: 0.858, w: 0.026, h: 0.030}
      shot_clock: {x: 0.307, y: 0.856, w: 0.030, h: 0.034}
