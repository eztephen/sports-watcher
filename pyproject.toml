[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-watcher"
version = "0.1.0"
description = "Watches live basketball broadcasts and emits a stream of game events for micro-betting markets."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "av>=14",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.18",
    "filterpy>=1.4.5",
    "scipy>=1.13",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10", "ruff>=0.6"]
youtube = ["yt-dlp>=2025.1.1"]
train = ["rfdetr[train,onnx]>=1.11", "torch>=2.4", "transformers>=4.44", "roboflow>=1.1"]

[tool.setuptools.packages.find]
include = ["sports_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs optional packages or network-free heavy models"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "models"]
